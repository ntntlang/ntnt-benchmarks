name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n benchmark.sh
          bash -n generate-report.sh
          bash -n append-to-dd.sh
      - name: Check Python scripts
        run: python3 -m py_compile scripts/run-ntnt-benchmarks.py
